<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地便签 · Markdown 笔记</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #5b8cff;
    --accent-2: #7cf2c0;
    --danger: #ff6b6b;
    --radius: 14px;
    --shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 80% -10%, #1a2030 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    color: #0b0e13; font-weight: 800; font-size: 15px;
    box-shadow: var(--shadow);
  }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 13px; }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    transition: .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: #fff; transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), #4b7bff); border-color: transparent; color: #fff; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 12px 22px 0;
    flex-wrap: wrap;
  }
  .toolbar .btn { padding: 6px 12px; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 22px 22px;
    min-height: 0;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 360px;
  }
  .card .head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .8px;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  textarea {
    flex: 1;
    width: 100%;
    border: 0;
    resize: none;
    background: transparent;
    color: var(--text);
    padding: 16px;
    font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 14px;
    line-height: 1.7;
    outline: none;
    tab-size: 2;
  }
  .preview {
    flex: 1;
    overflow: auto;
    padding: 16px 20px;
    word-wrap: break-word;
  }
  .preview h1, .preview h2, .preview h3 { line-height: 1.3; margin: 1em 0 .5em; }
  .preview h1 { font-size: 1.6em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  .preview h2 { font-size: 1.35em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  .preview h3 { font-size: 1.15em; }
  .preview p { margin: .6em 0; }
  .preview code {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .9em;
  }
  .preview pre {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    overflow: auto;
  }
  .preview pre code { border: 0; padding: 0; background: transparent; }
  .preview blockquote {
    margin: .6em 0;
    padding: .2em 14px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
    background: rgba(91,140,255,.06);
    border-radius: 0 8px 8px 0;
  }
  .preview a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(91,140,255,.4); }
  .preview a:hover { border-bottom-color: var(--accent); }
  .preview ul, .preview ol { padding-left: 1.4em; margin: .5em 0; }
  .preview hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }
  .preview table { border-collapse: collapse; width: 100%; margin: .6em 0; }
  .preview th, .preview td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .preview th { background: var(--panel-2); }
  .preview img { max-width: 100%; border-radius: 8px; }
  .empty { color: var(--muted); font-style: italic; }

  footer {
    padding: 10px 22px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .saved-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-2);
    display: inline-block; margin-right: 6px;
    transition: opacity .3s;
  }
  .saved-dot.idle { opacity: .25; }
</style>
</head>
<body>
<header>
  <h1><span class="logo">便</span>本地便签</h1>
  <span class="hint">Markdown 笔记 · 自动本地保存，关掉也不丢</span>
  <span class="spacer"></span>
  <button class="btn primary" id="downloadBtn">导出 .md</button>
  <button class="btn danger" id="clearBtn">清空</button>
</header>

<div class="toolbar">
  <button class="btn" data-md="# ">标题</button>
  <button class="btn" data-md="**粗体**">粗体</button>
  <button class="btn" data-md="*斜体*">斜体</button>
  <button class="btn" data-md="`代码`">行内代码</button>
  <button class="btn" data-md="> 引用">引用</button>
  <button class="btn" data-md="- 列表项">列表</button>
  <button class="btn" data-md="[链接](https://)">链接</button>
  <button class="btn" data-md="---">分割线</button>
</div>

<main>
  <section class="card">
    <div class="head">编辑 · Markdown</div>
    <textarea id="editor" placeholder="在这里写点什么…&#10;&#10;支持 # 标题、**粗体**、*斜体*、`代码`、- 列表、> 引用、[链接](https://) 等。&#10;内容会自动保存在本机浏览器中。"></textarea>
  </section>
  <section class="card">
    <div class="head">预览</div>
    <div class="preview" id="preview"><p class="empty">预览会实时显示在这里。</p></div>
  </section>
</main>

<footer>
  <span><span class="saved-dot idle" id="savedDot"></span><span id="statusText">尚未保存</span></span>
  <span id="countText">0 字</span>
  <span>数据仅存于本机 localStorage，不上传任何服务器。</span>
</footer>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "dayliydo.local-notes.content";
  var EDITOR_ID = "local-notes-editor";

  var editor = document.getElementById("editor");
  var preview = document.getElementById("preview");
  var statusText = document.getElementById("statusText");
  var savedDot = document.getElementById("savedDot");
  var countText = document.getElementById("countText");

  // ---------- 极简 Markdown 解析（纯 JS，无依赖） ----------
  function escapeHtml(s) {
    return s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // 行内：先转义，再做行内标记（代码块已在块级剥离，这里处理行内 code）
  function inline(text) {
    // 行内代码
    text = text.replace(/`([^`]+)`/g, function (_, c) {
      return "<code>" + c + "</code>";
    });
    // 粗体
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    // 斜体
    text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    text = text.replace(/_([^_]+)_/g, "<em>$1</em>");
    // 链接 [文字](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
      var safe = /^(https?:|mailto:|\/|#)/i.test(u.trim()) ? u : "#";
      return '<a href="' + escapeHtml(safe) + '" target="_blank" rel="noopener">' + t + "</a>";
    });
    return text;
  }

  function renderMarkdown(src) {
    var lines = src.replace(/\r\n/g, "\n").split("\n");
    var html = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      // 代码块 ```
      if (/^```/.test(line)) {
        var lang = line.slice(3).trim();
        var code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) {
          code.push(lines[i]);
          i++;
        }
        i++; // 跳过结束 ```
        html.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
        continue;
      }

      // 空行
      if (/^\s*$/.test(line)) { i++; continue; }

      // 标题
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var level = h[1].length;
        html.push("<h" + level + ">" + inline(escapeHtml(h[2])) + "</h" + level + ">");
        i++;
        continue;
      }

      // 分割线
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
        html.push("<hr>");
        i++;
        continue;
      }

      // 引用
      if (/^>\s?/.test(line)) {
        var quote = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          quote.push(lines[i].replace(/^>\s?/, ""));
          i++;
        }
        html.push("<blockquote>" + inline(escapeHtml(quote.join(" "))) + "</blockquote>");
        continue;
      }

      // 无序列表
      if (/^\s*[-*+]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          ul.push("<li>" + inline(escapeHtml(lines[i].replace(/^\s*[-*+]\s+/, ""))) + "</li>");
          i++;
        }
        html.push("<ul>" + ul.join("") + "</ul>");
        continue;
      }

      // 有序列表
      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push("<li>" + inline(escapeHtml(lines[i].replace(/^\s*\d+\.\s+/, ""))) + "</li>");
          i++;
        }
        html.push("<ol>" + ol.join("") + "</ol>");
        continue;
      }

      // 表格（简单 | a | b |）
      if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && /-/.test(lines[i + 1])) {
        var headerCells = splitRow(line);
        i += 2; // 跳过表头与分隔行
        var rows = [];
        while (i < lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        var thead = "<tr>" + headerCells.map(function (c) { return "<th>" + inline(escapeHtml(c)) + "</th>"; }).join("") + "</tr>";
        var tbody = rows.map(function (r) {
          return "<tr>" + r.map(function (c) { return "<td>" + inline(escapeHtml(c)) + "</td>"; }).join("") + "</tr>";
        }).join("");
        html.push("<table><thead>" + thead + "</thead><tbody>" + tbody + "</tbody></table>");
        continue;
      }

      // 普通段落（合并连续非块级行）
      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^(#{1,6})\s+/.test(lines[i]) &&
             !/^```/.test(lines[i]) &&
             !/^>\s?/.test(lines[i]) &&
             !/^\s*[-*+]\s+/.test(lines[i]) &&
             !/^\s*\d+\.\s+/.test(lines[i]) &&
             !/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())) {
        para.push(lines[i]);
        i++;
      }
      html.push("<p>" + inline(escapeHtml(para.join(" "))) + "</p>");
    }

    return html.join("\n");
  }

  function splitRow(row) {
    var r = row.trim().replace(/^\|/, "").replace(/\|$/, "");
    return r.split("|").map(function (c) { return c.trim(); });
  }

  // ---------- 状态与持久化 ----------
  var saveTimer = null;
  var saveTimeout = 400;

  function markSaved() {
    savedDot.classList.remove("idle");
    statusText.textContent = "已保存 ✓";
  }
  function markPending() {
    savedDot.classList.add("idle");
    statusText.textContent = "保存中…";
  }

  function updateCount() {
    var len = editor.value.length;
    var words = (editor.value.trim().match(/[一-龥]|[A-Za-z0-9]+/g) || []).length;
    countText.textContent = len + " 字符 · 约 " + words + " 词";
  }

  function render() {
    var src = editor.value;
    if (src.trim() === "") {
      preview.innerHTML = '<p class="empty">预览会实时显示在这里。</p>';
    } else {
      preview.innerHTML = renderMarkdown(src);
    }
    updateCount();
  }

  function scheduleSave() {
    markPending();
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(STORAGE_KEY, editor.value);
        markSaved();
      } catch (e) {
        statusText.textContent = "保存失败（本地存储不可用）";
      }
    }, saveTimeout);
  }

  editor.addEventListener("input", function () {
    render();
    scheduleSave();
  });

  // 工具栏插入片段
  document.querySelectorAll(".toolbar .btn[data-md]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var snippet = btn.getAttribute("data-md");
      var start = editor.selectionStart;
      var end = editor.selectionEnd;
      var sel = editor.value.slice(start, end);
      var insert = sel ? snippet.replace(/([*_`#>\-\[])/g, function (m, p) { return p; }) : snippet;
      // 若有选中则包裹（粗体/斜体/代码）
      var finalText;
      if (sel) {
        if (snippet === "**粗体**") finalText = "**" + sel + "**";
        else if (snippet === "*斜体*") finalText = "*" + sel + "*";
        else if (snippet === "`代码`") finalText = "`" + sel + "`";
        else if (snippet === "[链接](https://)") finalText = "[" + sel + "](https://)";
        else finalText = snippet + " " + sel;
      } else {
        finalText = snippet + " ";
      }
      editor.setRangeText(finalText, start, end, "end");
      editor.focus();
      render();
      scheduleSave();
    });
  });

  // 导出
  document.getElementById("downloadBtn").addEventListener("click", function () {
    var blob = new Blob([editor.value], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "note-" + new Date().toISOString().slice(0, 10) + ".md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // 清空
  document.getElementById("clearBtn").addEventListener("click", function () {
    if (editor.value.trim() !== "" && !confirm("确定清空当前便签？此操作不可撤销。")) return;
    editor.value = "";
    render();
    scheduleSave();
    editor.focus();
  });

  // 启动时恢复
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== null) {
      editor.value = saved;
      markSaved();
    } else {
      statusText.textContent = "尚未保存";
      savedDot.classList.add("idle");
    }
  } catch (e) {
    statusText.textContent = "本地存储不可用，仅本次会话有效";
  }
  render();
})();
</script>
</body>
</html>
