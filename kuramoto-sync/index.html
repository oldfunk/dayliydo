<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同步相变 · 序参量</title>
<style>
:root{
  --bg:#0b0f14; --panel:#131922; --border:#232c38;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent2:#3fb950; --warn:#d29922;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:16px;font-weight:600}
header .sub{color:var(--muted);font-size:12px}
main{flex:1;display:flex;min-height:0}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
aside{width:332px;border-left:1px solid var(--border);background:var(--panel);padding:14px;overflow:auto;font-size:13px}
aside h2{margin:14px 0 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.ctrl{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.ctrl label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.ctrl input[type=range]{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{background:#1c2430;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#0b0f14;border-color:var(--accent);flex:1}
button:disabled{opacity:.45;cursor:default}
.stat{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#2a1216;border:1px solid #5a2328;color:#f85149}
.badge.mid{background:#2e2410;border-color:#6b5210;color:var(--warn)}
.badge.ok{background:#17331f;border-color:var(--accent2);color:var(--accent2)}
.hint{color:var(--muted);font-size:11px;line-height:1.6;margin-top:8px}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:5px 0;cursor:pointer}
.chk input{accent-color:var(--accent)}
.sel{width:100%;background:#0b0f14;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 6px;font-size:12px}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,26,34,.94);border:1px solid var(--accent2);color:var(--accent2);padding:5px 12px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s}
@media (max-width:820px){
  html,body{overflow:auto}
  main{flex-direction:column}
  .canvas-wrap{min-height:52vh}
  aside{width:100%;border-left:none;border-top:1px solid var(--border)}
  header .sub{display:none}
}
</style>
</head>
<body>
<header>
  <h1>同步相变 · 序参量</h1>
  <span class="sub">每个振子只感受邻居的相位差正弦。把耦合 K 推过解析临界线 Kc=2γ 的那一刻，无序相突然塌缩成有序相——这不是画出来的，是局部规则自己走到的。</span>
</header>
<main>
  <div class="canvas-wrap">
    <canvas id="c" width="900" height="640"></canvas>
    <div id="toast"></div>
  </div>
  <aside>
    <div class="row">
      <button id="btnPlay" class="primary">暂停</button>
      <button id="btnScanUp">推过临界</button>
      <button id="btnReset">重置</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="btnScanDown">退回无序</button>
      <button id="btnStep">单步</button>
      <button id="btnPNG">导出 PNG</button>
    </div>

    <h2>实时</h2>
    <div><span class="badge" id="badge">无序相</span></div>
    <div class="stat" id="stat" style="margin-top:8px">-</div>
    <div class="hint" id="hint"></div>

    <h2>耦合</h2>
    <div class="ctrl"><label>耦合 K <span id="vK"></span></label><input id="K" type="range" min="0" max="4" step="0.01" value="0.8"></div>
    <div class="ctrl"><label>频率宽度 γ <span id="vW"></span></label><input id="W" type="range" min="0.05" max="2" step="0.01" value="0.5"></div>
    <div class="ctrl"><label>振子数 N <span id="vN"></span></label><input id="N" type="range" min="50" max="800" step="10" value="400"></div>
    <label class="chk"><input type="checkbox" id="trails" checked> 相位拖尾</label>

    <h2>系统</h2>
    <div class="ctrl"><label>频率分布</label><select id="dist" class="sel">
      <option value="lorentz" selected>洛伦兹单峰（有解析 Kc）</option>
      <option value="gauss">高斯单峰（近似解析 Kc）</option>
      <option value="bimodal">双峰（簇同步）</option>
    </select></div>
    <div class="ctrl"><label>耦合拓扑</label><select id="topo" class="sel">
      <option value="all" selected>全连接（平均场）</option>
      <option value="sw">小世界（含长程边）</option>
      <option value="ring">纯环（一维局部）</option>
    </select></div>
    <div class="ctrl"><label>初始条件</label><select id="init" class="sel">
      <option value="random" selected>随机相位（无序出发）</option>
      <option value="sync">近同步（有序出发）</option>
    </select></div>
    <div class="ctrl"><label>种子 <span id="vSeed"></span></label><input id="seed" type="range" min="1" max="9999" step="1" value="20261115"></div>
    <div class="ctrl"><label>每帧积分步 <span id="vSpd"></span></label><input id="spd" type="range" min="1" max="20" step="1" value="6"></div>
  </aside>
</main>
<script>
(function(){
'use strict';
var TAU=Math.PI*2;
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function makeGauss(rng){return function(){var u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);};}
function $(id){return document.getElementById(id);}
var cvs=$('c'), ctx=cvs.getContext('2d');
var CW=900, CH=640;
var CX=200, CY=252, RR=172;
var MAXN=800;
var dt=0.02;

var N=400, K=0.8, gam=0.5, dist='lorentz', topo='all', init='random', seed=20261115, spd=6;
var th=null, om=null, adj=null, d=null;
var rCur=0, psiCur=0;
var playing=true;
var scanDir=0, scanPts=[];
var showTrails=true;

function theoryKc(){
  if(dist==='lorentz') return 2*gam;
  if(dist==='gauss') return 2*Math.sqrt(2/Math.PI)*gam;
  return NaN;
}
function sampleFreqs(){
  var rng=mulberry32(seed), g=makeGauss(rng), a=new Float64Array(N), i, u;
  for(i=0;i<N;i++){
    if(dist==='lorentz'){
      u=rng(); if(u<=1e-9)u=1e-9; if(u>=1-1e-9)u=1-1e-9;
      a[i]=gam*Math.tan(Math.PI*(u-0.5));
    }else if(dist==='gauss'){
      a[i]=gam*g();
    }else{
      a[i]=(rng()<0.5?-1:1)*gam + 0.15*gam*g();
    }
  }
  return a;
}
function buildAdj(){
  var a=new Array(N), i, k, rng;
  for(i=0;i<N;i++){
    if(topo==='all'){ a[i]=null; }
    else if(topo==='ring'){ a[i]=[(i-1+N)%N,(i+1)%N]; }
    else{
      var list=[(i-1+N)%N,(i+1)%N];
      rng=mulberry32(seed*131+i*7919);
      for(k=0;k<2;k++){
        var j=Math.floor(rng()*N);
        if(j!==i && list.indexOf(j)<0) list.push(j);
      }
      a[i]=list;
    }
  }
  return a;
}
function buildAll(){
  om=sampleFreqs();
  adj=buildAdj();
  th=new Float64Array(N);
  d=new Float64Array(MAXN);
  var rng=mulberry32((seed^0x9e3779b9)>>>0), i;
  if(init==='sync'){
    var g=makeGauss(rng);
    for(i=0;i<N;i++) th[i]=(0.08*gam*g())%TAU;
  }else{
    for(i=0;i<N;i++) th[i]=TAU*rng();
  }
  for(i=0;i<N;i++) if(th[i]<0) th[i]+=TAU;
  var op=orderParam(); rCur=op[0]; psiCur=op[1];
  scanPts=[]; scanDir=0;
}
function orderParam(){
  var re=0, im=0, i;
  for(i=0;i<N;i++){ re+=Math.cos(th[i]); im+=Math.sin(th[i]); }
  re/=N; im/=N;
  return [Math.hypot(re,im), Math.atan2(im,re)];
}
function deriv(out){
  var i, k;
  if(topo==='all'){
    var re=0, im=0;
    for(i=0;i<N;i++){ re+=Math.cos(th[i]); im+=Math.sin(th[i]); }
    re/=N; im/=N;
    var r=Math.hypot(re,im), psi=Math.atan2(im,re);
    for(i=0;i<N;i++) out[i]=om[i]+K*r*Math.sin(psi-th[i]);
  }else{
    for(i=0;i<N;i++){
      var a=adj[i], s=0;
      for(k=0;k<a.length;k++) s+=Math.sin(th[a[k]]-th[i]);
      out[i]=om[i]+K*s/a.length;
    }
  }
}
function step(n){
  var s, i;
  for(s=0;s<n;s++){
    deriv(d);
    for(i=0;i<N;i++){
      th[i]=(th[i]+d[i]*dt)%TAU;
      if(th[i]<0) th[i]+=TAU;
    }
  }
  var op=orderParam(); rCur=op[0]; psiCur=op[1];
}

/* ---------- 绘制 ---------- */
function drawRing(){
  ctx.save();
  ctx.beginPath(); ctx.arc(CX,CY,RR+24,0,TAU); ctx.clip();
  ctx.fillStyle=showTrails?'rgba(11,15,20,0.10)':'#0b0f14';
  ctx.fillRect(CX-RR-28,CY-RR-28,2*RR+56,2*RR+56);
  ctx.strokeStyle='#232c38'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(CX,CY,RR,0,TAU); ctx.stroke();
  ctx.strokeStyle='#1a2230';
  ctx.beginPath(); ctx.arc(CX,CY,RR*0.55,0,TAU); ctx.stroke();
  var i, x, y;
  for(i=0;i<N;i++){
    x=CX+RR*Math.cos(th[i]); y=CY-RR*Math.sin(th[i]);
    ctx.fillStyle='hsl('+Math.round(th[i]*360/TAU)+',85%,55%)';
    ctx.beginPath(); ctx.arc(x,y,3.2,0,TAU); ctx.fill();
  }
  var ax=CX+rCur*RR*0.85*Math.cos(psiCur), ay=CY-rCur*RR*0.85*Math.sin(psiCur);
  ctx.strokeStyle='#e6edf3'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(ax,ay); ctx.stroke();
  ctx.fillStyle='#e6edf3';
  ctx.beginPath(); ctx.arc(ax,ay,3.4,0,TAU); ctx.fill();
  ctx.fillStyle='#8b949e'; ctx.font='11px ui-monospace,Menlo,monospace';
  ctx.fillText('r='+rCur.toFixed(3), CX-34, CY+RR+20);
  ctx.restore();
}

var CHX=420, CHY=48, CHW=440, CHH=332;
function drawChart(){
  var x0=CHX, y0=CHY, w=CHW, h=CHH, i;
  ctx.fillStyle='#0b0f14'; ctx.fillRect(x0,y0,w,h);
  ctx.strokeStyle='#232c38'; ctx.lineWidth=1; ctx.strokeRect(x0,y0,w,h);
  ctx.fillStyle='#8b949e'; ctx.font='11px ui-monospace,Menlo,monospace';
  ctx.fillText('序参量 r — 耦合 K 曲线', x0+10, y0+16);
  var gy;
  ctx.strokeStyle='#1a2230';
  for(i=0;i<=4;i++){
    gy=y0+h-(h*i/4);
    ctx.beginPath(); ctx.moveTo(x0,gy); ctx.lineTo(x0+w,gy); ctx.stroke();
    ctx.fillText((i/4).toFixed(2), x0+4, gy-3);
  }
  var kc=theoryKc();
  if(!isNaN(kc) && kc>0 && kc<=4){
    var kx=x0+w*kc/4;
    ctx.strokeStyle='#d29922'; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(kx,y0); ctx.lineTo(kx,y0+h); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#d29922';
    ctx.fillText('理论 Kc='+(Math.round(kc*1000)/1000), kx+4, y0+16);
  }
  if(scanPts.length>1){
    ctx.strokeStyle='#58a6ff'; ctx.lineWidth=1.6;
    ctx.beginPath();
    for(i=0;i<scanPts.length;i++){
      var px=x0+w*scanPts[i][0]/4, py=y0+h-(h*scanPts[i][1]);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.fillStyle='#58a6ff';
    for(i=0;i<scanPts.length;i+=Math.ceil(scanPts.length/120)||1){
      px=x0+w*scanPts[i][0]/4; py=y0+h-(h*scanPts[i][1]);
      ctx.fillRect(px-1.5,py-1.5,3,3);
    }
  }
  var ckx=x0+w*K/4;
  ctx.strokeStyle='#e6edf3'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(ckx,y0); ctx.lineTo(ckx,y0+h); ctx.stroke();
  ctx.fillStyle='#e6edf3';
  ctx.fillText('K='+(Math.round(K*100)/100), ckx+4, y0+h-6);
  ctx.fillStyle='#8b949e';
  ctx.fillText('0', x0+2, y0+h+12);
  ctx.fillText('4', x0+w-8, y0+h+12);
}

function drawHistograms(){
  var i, b, x0, y0, w, h, n=24, mx;
  var hist=new Array(n), om2=new Array(n);
  for(i=0;i<n;i++){ hist[i]=0; om2[i]=0; }
  for(i=0;i<N;i++){
    b=Math.floor(th[i]/TAU*n); if(b>=n)b=n-1;
    hist[b]++;
  }
  var lim=3*gam;
  for(i=0;i<N;i++){
    var v=om[i]; if(v>lim)v=lim; if(v<-lim)v=-lim;
    b=Math.floor((v+lim)/(2*lim)*n); if(b<0)b=0; if(b>=n)b=n-1;
    om2[b]++;
  }
  mx=1; for(i=0;i<n;i++){ if(hist[i]>mx)mx=hist[i]; if(om2[i]>mx)mx=om2[i]; }

  x0=40; y0=478; w=400; h=130;
  ctx.fillStyle='#0b0f14'; ctx.fillRect(x0,y0,w,h);
  ctx.strokeStyle='#232c38'; ctx.strokeRect(x0,y0,w,h);
  ctx.fillStyle='#8b949e'; ctx.font='11px ui-monospace,Menlo,monospace';
  ctx.fillText('相位分布（当前）', x0+8, y0+14);
  var bw=w/n;
  for(i=0;i<n;i++){
    var bh=hist[i]/mx*(h-26);
    ctx.fillStyle='hsl('+Math.round(i*360/n)+',80%,52%)';
    ctx.fillRect(x0+i*bw+1, y0+h-12-bh, bw-2, bh);
  }

  x0=470; y0=478; w=390; h=130;
  ctx.fillStyle='#0b0f14'; ctx.fillRect(x0,y0,w,h);
  ctx.strokeStyle='#232c38'; ctx.strokeRect(x0,y0,w,h);
  ctx.fillStyle='#8b949e'; ctx.font='11px ui-monospace,Menlo,monospace';
  ctx.fillText('本征频率分布 ω', x0+8, y0+14);
  bw=w/n;
  ctx.fillStyle='#3fb950';
  for(i=0;i<n;i++){
    var bh2=om2[i]/mx*(h-26);
    ctx.fillRect(x0+i*bw+1, y0+h-12-bh2, bw-2, bh2);
  }
}

function updateStat(){
  var kc=theoryKc();
  var ratio=isNaN(kc)?'—':(K/kc).toFixed(2);
  var txt='N='+N+'  K='+(Math.round(K*100)/100)+'  γ='+(Math.round(gam*100)/100)+'\n'+
          '理论 Kc='+(isNaN(kc)?'—（双峰无解析）':kc.toFixed(3))+'  K/Kc='+ratio+'\n'+
          '序参量 r='+rCur.toFixed(3)+'  ψ='+psiCur.toFixed(3)+'\n'+
          '拓扑='+(topo==='all'?'全连接':(topo==='sw'?'小世界':'纯环'))+'  分布='+dist;
  $('stat').textContent=txt;
  var badge=$('badge'), cls='badge', label='无序相';
  if(rCur>0.6){ cls='badge ok'; label='已同步'; }
  else if(rCur>0.15){ cls='badge mid'; label='转变中'; }
  badge.className=cls; badge.textContent=label;
  var hint='';
  if(isNaN(kc)){
    hint='双峰分布没有解析临界值：两群振子各自锁相、彼此不合，表现为「簇同步」——看相位分布里的两个峰。';
  }else if(K<kc){
    hint='还差 '+((kc-K)/kc*100).toFixed(0)+'% 才到临界。推过 Kc 的那一刻，r 会突然跳起来。';
  }else{
    hint='已过临界 '+((K/kc-1)*100).toFixed(0)+'%。若 r 仍偏低，是有限尺寸与频率无序在拖后腿：加大 N 或减小 γ 再试。';
  }
  $('hint').textContent=hint;
}

function draw(){
  ctx.clearRect(0,0,CW,CH);
  drawRing();
  drawChart();
  drawHistograms();
  updateStat();
}

function syncLabels(){
  $('vK').textContent=String(Math.round(K*100)/100);
  $('vW').textContent=String(Math.round(gam*100)/100);
  $('vN').textContent=String(N);
  $('vSeed').textContent=String(seed);
  $('vSpd').textContent=String(spd);
}

var rafQ=null;
function loop(){
  if(playing){
    if(scanDir!==0){
      K+=scanDir*0.008;
      if(K<=0){ K=0; scanDir=0; }
      if(K>=4){ K=4; scanDir=0; }
      $('K').value=String(K);
      syncLabels();
    }
    step(spd);
    if(scanDir!==0) scanPts.push([K,rCur]);
  }
  draw();
  window.__raf(loop);
}

function toast(msg){
  var t=$('toast');
  t.textContent=msg;
  t.style.opacity='1';
  window.setTimeout(function(){ t.style.opacity='0'; },1400);
}

/* ---------- 事件 ---------- */
$('btnPlay').addEventListener('click',function(){
  playing=!playing;
  this.textContent=playing?'暂停':'继续';
});
$('btnStep').addEventListener('click',function(){
  if(playing){ playing=false; $('btnPlay').textContent='继续'; }
  step(spd);
  draw();
});
$('btnReset').addEventListener('click',function(){
  buildAll(); draw(); toast('已按当前种子重建');
});
$('btnScanUp').addEventListener('click',function(){
  if(scanDir===0){ scanPts=[]; scanDir=1; if(K>=4)K=3.9; toast('扫描：K 升支'); }
  else { scanDir=0; toast('停止扫描'); }
});
$('btnScanDown').addEventListener('click',function(){
  if(scanDir===0){ scanPts=[]; scanDir=-1; if(K<=0)K=0.1; toast('扫描：K 降支'); }
  else { scanDir=0; toast('停止扫描'); }
});
$('btnPNG').addEventListener('click',function(){
  var a=document.createElement('a');
  a.download='kuramoto-sync.png';
  a.href=cvs.toDataURL('image/png');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});
$('K').addEventListener('input',function(){ K=parseFloat(this.value); syncLabels(); });
$('W').addEventListener('input',function(){
  gam=parseFloat(this.value); om=sampleFreqs(); syncLabels();
});
$('N').addEventListener('input',function(){ N=parseInt(this.value,10); buildAll(); syncLabels(); });
$('seed').addEventListener('input',function(){ seed=parseInt(this.value,10); buildAll(); syncLabels(); });
$('spd').addEventListener('input',function(){ spd=parseInt(this.value,10); syncLabels(); });
$('dist').addEventListener('change',function(){ dist=this.value; buildAll(); });
$('topo').addEventListener('change',function(){ topo=this.value; buildAll(); });
$('init').addEventListener('change',function(){ init=this.value; buildAll(); });
$('trails').addEventListener('change',function(){ showTrails=this.checked; });

document.addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); $('btnPlay').click(); }
  else if(e.key==='r'||e.key==='R'){ buildAll(); draw(); }
  else if(e.key==='s'||e.key==='S'){ $('btnStep').click(); }
});

/* ---------- 启动 ---------- */
window.__raf=function(f){ return requestAnimationFrame(f); };
window.__t={
  get N(){return N;}, set N(v){N=v;},
  get K(){return K;}, set K(v){K=v;},
  get gam(){return gam;}, set gam(v){gam=v;},
  get dist(){return dist;}, set dist(v){dist=v;},
  get topo(){return topo;}, set topo(v){topo=v;},
  get seed(){return seed;}, set seed(v){seed=v;},
  get th(){return th;}, get om(){return om;}, get adj(){return adj;},
  get r(){return rCur;}, get psi(){return psiCur;},
  TAU:TAU, dt:dt, MAXN:MAXN,
  buildAll:buildAll, step:step, deriv:deriv, orderParam:orderParam,
  theoryKc:theoryKc, sampleFreqs:sampleFreqs, buildAdj:buildAdj,
